<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<!-- The app icon. Edit this, then run `npm run icons` to regenerate every size.
     Draw a full square without rounded corners; the script rounds them where needed.
     Keep the mark inside the maskable safe zone: a circle of radius 204 around the centre. -->
<!-- A geometric reindeer head, its antlers six coloured threads rising from the weave.
     Behind the head, a faint blurred blob hints at the body.
     The field follows the app header band at the same 120° angle, from violet to a softer plum, so the pastel threads stand out. -->
<defs>
<linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="-46.8" y1="81.2" x2="558.8" y2="430.8"><stop stop-color="#5546e8"/><stop offset="1" stop-color="#a0428c"/></linearGradient>
<linearGradient id="lav" gradientUnits="userSpaceOnUse" x1="0" y1="248.75" x2="0" y2="305"><stop stop-color="#c3b1f2"/><stop offset="1" stop-color="#f6f5f1"/></linearGradient>
<linearGradient id="blue" gradientUnits="userSpaceOnUse" x1="0" y1="220.625" x2="0" y2="305"><stop stop-color="#85b7eb"/><stop offset="1" stop-color="#f6f5f1"/></linearGradient>
<linearGradient id="green" gradientUnits="userSpaceOnUse" x1="0" y1="203.75" x2="0" y2="305"><stop stop-color="#5dcaa5"/><stop offset="1" stop-color="#f6f5f1"/></linearGradient>
<linearGradient id="yellow" gradientUnits="userSpaceOnUse" x1="0" y1="203.75" x2="0" y2="305"><stop stop-color="#efd77a"/><stop offset="1" stop-color="#f6f5f1"/></linearGradient>
<linearGradient id="orange" gradientUnits="userSpaceOnUse" x1="0" y1="220.625" x2="0" y2="305"><stop stop-color="#f0b25c"/><stop offset="1" stop-color="#f6f5f1"/></linearGradient>
<linearGradient id="pink" gradientUnits="userSpaceOnUse" x1="0" y1="248.75" x2="0" y2="305"><stop stop-color="#f2a3a3"/><stop offset="1" stop-color="#f6f5f1"/></linearGradient>
</defs>
<rect width="512" height="512" fill="url(#bg)"/>
<g stroke-width="22" stroke-linecap="round" fill="none">
<path d="M80 180 C80 252.5 231 260 231 305" stroke="url(#lav)"/>
<path d="M125 117.5 C125 226.25 237 237.5 237 305" stroke="url(#blue)"/>
<path d="M178 80 C178 210.5 243 224 243 305" stroke="url(#green)"/>
<path d="M334 80 C334 210.5 269 224 269 305" stroke="url(#yellow)"/>
<path d="M387 117.5 C387 226.25 275 237.5 275 305" stroke="url(#orange)"/>
<path d="M432 180 C432 252.5 281 260 281 305" stroke="url(#pink)"/>
</g>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="12"/></filter>
<path d="M256 324 C334 324 394 362 398 422 C402 480 340 502 256 502 C172 502 110 480 114 422 C118 362 178 324 256 324 Z" fill="#f6f5f1" opacity="0.14" filter="url(#soft)"/>
<polygon points="215,300 297,300 303,325 273,415 239,415 209,325" fill="#f6f5f1" stroke="#f6f5f1" stroke-width="18" stroke-linejoin="round"/>
</svg>
