<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
	<meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="default">
	<meta name="apple-mobile-web-app-title" content="Loom">
	<title>Loom</title>
	<!-- use-credentials: behind Cloudflare Access the manifest needs the session cookie -->
	<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
	<link rel="icon" href="/icon.svg" type="image/svg+xml">
	<link rel="apple-touch-icon" href="/apple-touch-icon.png">
	<link rel="stylesheet" href="/app.css">
	<script src="/app.js" defer></script>
</head>
<body>
	<main id="app" aria-live="polite">
		<header class="top">
			<button class="nav" id="prev" aria-label="Previous week">‹</button>
			<div class="top-mid">
				<div class="muted small" id="range">&nbsp;</div>
				<h1 id="headline">Loading…</h1>
			</div>
			<div class="score">
				<div id="adherence" class="big">–</div>
				<div class="muted small" id="vs">&nbsp;</div>
			</div>
			<button class="nav" id="next" aria-label="Next week">›</button>
		</header>

		<div id="banner" class="banner" hidden></div>

		<section class="cards" id="cards"></section>

		<section>
			<div class="sec"><span>Habits</span><span class="muted">Tap a day for details</span></div>
			<div class="grid" id="grid" role="table" aria-label="Habits this week"></div>
			<div class="detail muted small" id="detail">&nbsp;</div>
		</section>

		<section>
			<div class="sec"><span>Short-term goals</span><span class="muted">From Notion</span></div>
			<div id="goals-short"></div>
		</section>

		<section>
			<div class="sec"><span>Perennial goals</span><span class="muted">From Notion</span></div>
			<div id="goals-perennial"></div>
		</section>

		<footer class="muted small" id="synced">&nbsp;</footer>
	</main>
</body>
</html>
